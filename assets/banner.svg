<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity=".22"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect x="760" y="0" width="440" height="300" fill="url(#dots)"/>
  <circle cx="1080" cy="40" r="150" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="980" cy="270" r="95" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="1090" cy="170" r="46" fill="#fde68a" opacity=".35">
    <animate attributeName="r" values="40;54;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="70" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#fde68a">ÉTUDIANT EN BUT INFORMATIQUE</text>
  <text x="66" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Ensar <tspan fill="#fde68a">PALA</tspan></text>
  <text x="70" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#f5f3ff">Futur développeur · IUT de Laval · Rennes</text>
  <rect x="70" y="244" width="410" height="34" rx="17" fill="#ffffff"/>
  <circle cx="92" cy="261" r="6" fill="#22c55e">
    <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="108" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#4f46e5">En recherche de stage · avril → juin 2027</text>
</svg>
