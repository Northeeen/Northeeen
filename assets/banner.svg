<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3528"/>
      <stop offset="0.55" stop-color="#1f7a4d"/>
      <stop offset="1" stop-color="#2bb673"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#a9e5c2" opacity=".25"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect x="760" y="0" width="440" height="300" fill="url(#dots)"/>
  <circle cx="1080" cy="40" r="150" fill="none" stroke="#a9e5c2" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="980" cy="270" r="95" fill="none" stroke="#a9e5c2" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="1090" cy="170" r="46" fill="#a9e5c2" opacity=".18">
    <animate attributeName="r" values="40;54;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="70" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#a9e5c2">ÉTUDIANT EN BUT INFORMATIQUE</text>
  <text x="66" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">Ensar <tspan fill="#a9e5c2">PALA</tspan></text>
  <text x="70" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#e8f4ec">Développeur web, mobile &amp; bots · Rennes</text>
  <rect x="70" y="244" width="330" height="34" rx="17" fill="#ffffff"/>
  <circle cx="92" cy="261" r="6" fill="#2bb673">
    <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="108" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f3528">Cherche un stage · avril 2027</text>
</svg>
